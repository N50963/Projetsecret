[package]
name = "lecteur"
version = "1.0.0"
edition = "2021"

[lib]
name = "lecteur"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "lecteur-desktop"
path = "src/main.rs"

[dependencies]
bureau_core = { path = "../core" }
log = "0.4"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
ttf-parser = "0.25"

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "glow", "x11", "wayland"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "android-native-activity"] }
winit = { version = "0.30", features = ["android-native-activity"] }
android_logger = "0.15"
jni = "0.21"
ndk = "0.9"
