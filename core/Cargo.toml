[package]
name = "bureau_core"
version = "1.0.0"
edition = "2021"

[dependencies]
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
ttf-parser = "0.25"
zip = { version = "9", default-features = false, features = ["deflate"] }
roxmltree = "0.21"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
unicode-linebreak = "0.1"
calamine = { version = "0.38", default-features = false }
cfb = "0.16"
encoding_rs = "0.8"
log = "0.4"
png = "0.18"
