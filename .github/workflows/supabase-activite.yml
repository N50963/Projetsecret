# Plan gratuit Supabase : un projet sans activité pendant 7 jours est mis en pause.
# Quelques requêtes légères chaque jour (fonction ping, aucune donnée lue) gardent le projet actif
# même pendant des vacances. Les tâches planifiées ne s'exécutent que depuis la branche par défaut du dépôt.
name: Activité Supabase (plan gratuit)

on:
  schedule:
    - cron: "37 16 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Requêtes légères sur la base
        env:
          SUPABASE_URL: https://avhqhvedgppuieellruz.supabase.co
          # Clé publique (la même que dans l'application) : elle ne donne accès qu'à la fonction ping.
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_RW3TFIdg-dJtuHAN9lEsbg_v7qSmACQ
        run: |
          for i in 1 2 3; do
            curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/ping" -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              -H "Content-Type: application/json" -d '{}'
            echo
            sleep 20
          done
